<title>相册 - 3D 手势交互照片墙</title>
  <meta name="description" content="基于 Three.js 的 3D 手势交互相册，支持摄像头手势翻页浏览">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block}
#container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2}

/* 布局名称 */
#layout-name{position:fixed;top:30px;width:100%;text-align:center;z-index:10;
  color:rgba(127,255,255,.7);font-size:15px;letter-spacing:6px;
  text-shadow:0 0 15px rgba(0,255,255,.4);opacity:0;transition:opacity .6s;pointer-events:none}
#layout-name.show{opacity:1}

/* 指示器 */
#indicator{position:fixed;bottom:28px;width:100%;text-align:center;z-index:10}
.dot{display:inline-block;width:10px;height:10px;margin:0 7px;border-radius:50%;
  background:rgba(127,255,255,.25);cursor:pointer;transition:all .4s}
.dot.active{background:rgba(0,255,255,.9);box-shadow:0 0 14px rgba(0,255,255,.6);transform:scale(1.3)}

/* 手势状态 */
#gesture-ui{position:fixed;top:18px;left:18px;z-index:20;display:flex;align-items:center;gap:10px}
#gesture-icon{font-size:32px;filter:drop-shadow(0 0 8px rgba(0,255,255,.5))}
#gesture-text{color:rgba(127,255,255,.8);font-size:12px;letter-spacing:2px;
  font-family:'Courier New',monospace;text-shadow:0 0 8px rgba(0,255,255,.3)}

/* 摄像头预览 - 已隐藏 */
#cam-preview{display:none}

/* 照片卡片 */
.element{width:120px;height:160px;border-radius:6px;overflow:hidden;
  box-shadow:0 0 15px rgba(0,255,255,.25);border:1px solid rgba(127,255,255,.12);
  cursor:pointer;transition:box-shadow .3s,border-color .3s,transform .3s}
.element:hover{box-shadow:0 0 30px rgba(0,255,255,.6),0 0 60px rgba(0,255,255,.15);
  border-color:rgba(0,255,255,.5);transform:scale(1.03)}
.element img{position:absolute;border:none;border-radius:5px}

/* 鼠标光晕 */
#cursor-glow{position:fixed;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,255,255,.05) 0%,transparent 70%);
  pointer-events:none;z-index:1;transform:translate(-50%,-50%)}

@media(hover:hover){#cursor-glow{display:block}}
@media(hover:none){#cursor-glow{display:none}}

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';

// ============================================================
//  全局变量
// ============================================================
let camera, scene, renderer, controls;
const objects = [];
const targets = { table: [], sphere: [], helix: [], grid: [] };
const photoData = [];
let currentLayout = 0;
const layoutNames = ['照片墙', '水晶球', '螺旋塔', '展览厅'];
const clock = new THREE.Clock();

// 粒子
let starPoints, starVelocities;
const mouseTrail = [];
const burstList = [];
let pCanvas, pCtx;

// 手势
let handLandmarker = null;
let camVideo = null;
let lastVideoTime = -1;
let handState = { mode: 'IDLE', handX: 0, handY: 0, rotation: { x: 0, y: 0 } };
let gestureCooldown = 0;

// ============================================================
//  照片数据
// ============================================================
function buildPhotoData() {
  const names = ["1.jpg","2.jpg","76.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg","10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18.jpg","19.jpg","20.jpg","21.jpg","22.jpg","23.jpg","24.jpg","74.jpg","26.jpg","73.jpg","28.jpg","29.jpg","30.jpg","31.jpg","32.jpg","33.jpg","34.jpg","35.jpg","36.jpg","37.jpg","38.jpg","39.jpg","40.jpg","41.jpg","42.jpg","43.jpg","44.jpg","45.jpg","46.jpg","47.jpg","48.jpg","49.jpg","50.jpg","51.jpg","52.jpg","53.jpg","54.jpg","55.jpg","56.jpg","66.jpg","67.jpg","68.jpg","74.jpg","70.jpg","71.jpg","72.jpg","57.jpg","58.jpg","59.jpg","60.jpg","61.jpg","62.jpg","63.jpg","64.jpg","65.jpg"];
  let row = 1, col = 1;
  for (const n of names) {
    photoData.push({ name: n, col: col, row: row });
    col++;
    if (col > 18) { col = 1; row++; }
  }
}

// ============================================================
//  星空粒子 (WebGL)
// ============================================================
function createStarField() {
  const N = 3000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const sz = new Float32Array(N);
  starVelocities = new Float32Array(N * 3);

  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    pos[i3]   = (Math.random() - .5) * 10000;
    pos[i3+1] = (Math.random() - .5) * 10000;
    pos[i3+2] = (Math.random() - .5) * 10000;
    const c = new THREE.Color().setHSL(Math.random()*.3+.5, .85, .5+Math.random()*.3);
    col[i3]=c.r; col[i3+1]=c.g; col[i3+2]=c.b;
    sz[i] = Math.random()*3+1;
    starVelocities[i3]   = (Math.random()-.5)*.4;
    starVelocities[i3+1] = (Math.random()-.5)*.4;
    starVelocities[i3+2] = (Math.random()-.5)*.4;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float time;
      void main(){
        vColor = color;
        vAlpha = .35 + .65*sin(time*.4 + position.x*.008 + position.y*.012);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = size * (280.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main(){
        float d = length(gl_PointCoord - vec2(.5));
        if(d>.5) discard;
        float g = 1.0-d*2.0; g*=g;
        gl_FragColor = vec4(vColor, vAlpha*g);
      }`,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  starPoints = new THREE.Points(geo, mat);
}

function updateStars(dt, t) {
  starPoints.material.uniforms.time.value = t;
  const p = starPoints.geometry.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) {
    p[i]   += starVelocities[i]   * dt * 8;
    p[i+1] += starVelocities[i+1] * dt * 8;
    p[i+2] += starVelocities[i+2] * dt * 8;
    if (Math.abs(p[i])   > 5000) p[i]   *= -.99;
    if (Math.abs(p[i+1]) > 5000) p[i+1] *= -.99;
    if (Math.abs(p[i+2]) > 5000) p[i+2] *= -.99;
  }
  starPoints.geometry.attributes.position.needsUpdate = true;
  starPoints.rotation.y += .00015;
  starPoints.rotation.x += .00008;
}

// ============================================================
//  2D 粒子 (拖尾 + 爆发)
// ============================================================
function initParticleCanvas() {
  pCanvas = document.createElement('canvas');
  pCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3';
  document.body.appendChild(pCanvas);
  pCtx = pCanvas.getContext('2d');
  resizePCanvas();
}
function resizePCanvas() { if(pCanvas){pCanvas.width=innerWidth;pCanvas.height=innerHeight;} }

for (let i = 0; i < 60; i++) mouseTrail.push({x:0,y:0,vx:0,vy:0,life:0,max:0,sz:0,on:false});

function spawnTrail(x, y) {
  for (const p of mouseTrail) {
    if (!p.on) {
      p.x=x; p.y=y; p.vx=(Math.random()-.5)*3; p.vy=(Math.random()-.5)*3-1;
      p.life=1; p.max=Math.random()*.5+.3; p.sz=Math.random()*4+2; p.on=true;
      break;
    }
  }
}

function burst(cx, cy, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, spd = Math.random()*18+4;
    burstList.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:1,decay:Math.random()*.02+.008,sz:Math.random()*5+2,hue:Math.random()*.3+.5});
  }
}

function drawParticles(dt) {
  if (!pCtx) return;
  const w = pCanvas.width, h = pCanvas.height;
  pCtx.clearRect(0,0,w,h);

  // 拖尾
  for (const p of mouseTrail) {
    if (!p.on) continue;
    p.x += p.vx; p.y += p.vy; p.vy += .02;
    p.life -= dt / p.max;
    if (p.life <= 0) { p.on = false; continue; }
    const a = p.life*.6, s = p.sz*p.life;
    const g = pCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,s);
    g.addColorStop(0,`rgba(0,255,255,${a})`);
    g.addColorStop(.5,`rgba(0,180,255,${a*.4})`);
    g.addColorStop(1,'rgba(0,80,255,0)');
    pCtx.beginPath(); pCtx.arc(p.x,p.y,s,0,Math.PI*2); pCtx.fillStyle=g; pCtx.fill();
  }

  // 连线
  pCtx.lineWidth = .5;
  for (let i = 0; i < mouseTrail.length; i++) {
    const a = mouseTrail[i]; if (!a.on) continue;
    for (let j = i+1; j < mouseTrail.length; j++) {
      const b = mouseTrail[j]; if (!b.on) continue;
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d < 80) {
        pCtx.globalAlpha = (1-d/80)*Math.min(a.life,b.life)*.25;
        pCtx.strokeStyle = 'rgba(0,255,255,.1)';
        pCtx.beginPath(); pCtx.moveTo(a.x,a.y); pCtx.lineTo(b.x,b.y); pCtx.stroke();
      }
    }
  }
  pCtx.globalAlpha = 1;

  // 爆发
  for (let i = burstList.length-1; i >= 0; i--) {
    const p = burstList[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy*=.97; p.life-=p.decay;
    if (p.life<=0) { burstList.splice(i,1); continue; }
    const c = new THREE.Color().setHSL(p.hue,.8,.6);
    const r=c.r*255|0, g=c.g*255|0, b=c.b*255|0;
    const a=p.life*.8, s=p.sz*p.life;
    const gr = pCtx.createRadialGradient(p.x,p.y,0,p.x,p.y,s);
    gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
    pCtx.beginPath(); pCtx.arc(p.x,p.y,s,0,Math.PI*2); pCtx.fillStyle=gr; pCtx.fill();
  }
}

// ============================================================
//  主场景
// ============================================================
function initScene() {
  camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 10000);
  camera.position.z = 3000;
  scene = new THREE.Scene();

  for (let i = 0; i < photoData.length; i++) {
    const d = photoData[i];
    const el = document.createElement('div');
    el.className = 'element';
    el.style.backgroundColor = `rgba(0,30,50,${Math.random()*.3+.08})`;

    const a = document.createElement('a');
    a.href = `https://tc1.21212121.xyz/xb/QQ头像/${d.name}`;
    a.title = d.name;
    const img = new Image();
    img.src = a.href;
    a.appendChild(img);
    el.appendChild(a);

    const obj = new CSS3DObject(el);
    obj.position.set((Math.random()-.5)*4000, (Math.random()-.5)*4000, (Math.random()-.5)*4000);
    scene.add(obj);
    objects.push(obj);

    const t = new THREE.Object3D();
    t.position.set(d.col*140-1330, -(d.row*180)+990, 0);
    targets.table.push(t);

    img.onload = () => fitImg(img, 120, 160);
  }

  // 水晶球
  const v = new THREE.Vector3();
  for (let i = 0, l = objects.length; i < l; i++) {
    const phi = Math.acos(-1+2*i/l), theta = Math.sqrt(l*Math.PI)*phi;
    const t = new THREE.Object3D();
    t.position.set(800*Math.cos(theta)*Math.sin(phi), 800*Math.sin(theta)*Math.sin(phi), 800*Math.cos(phi));
    v.copy(t.position).multiplyScalar(2);
    t.lookAt(v);
    targets.sphere.push(t);
  }

  // 螺旋塔
  for (let i = 0, l = objects.length; i < l; i++) {
    const phi = i*.175+Math.PI;
    const t = new THREE.Object3D();
    t.position.set(900*Math.sin(phi), -(i*8)+450, 900*Math.cos(phi));
    v.set(t.position.x*2, t.position.y, t.position.z*2);
    t.lookAt(v);
    targets.helix.push(t);
  }

  // 展览厅
  for (let i = 0; i < objects.length; i++) {
    const t = new THREE.Object3D();
    t.position.set((i%5)*400-800, -(Math.floor(i/5)%5)*400+800, Math.floor(i/25)*1000-2000);
    targets.grid.push(t);
  }

  renderer = new CSS3DRenderer();
  renderer.setSize(innerWidth, innerHeight);
  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.top = '0';
  document.getElementById('container').appendChild(renderer.domElement);

  controls = new TrackballControls(camera, renderer.domElement);
  controls.rotateSpeed = .5;
  controls.minDistance = 500;
  controls.maxDistance = 6000;
  controls.addEventListener('change', () => renderer.render(scene, camera));

  // 事件
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => switchLayout(+d.dataset.i));
  document.addEventListener('mousemove', e => {
    document.getElementById('cursor-glow').style.cssText = `left:${e.clientX}px;top:${e.clientY}px`;
    spawnTrail(e.clientX, e.clientY);
  });
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight') switchLayout((currentLayout+1)%4);
    if (e.key==='ArrowLeft')  switchLayout((currentLayout+3)%4);
  });

  // 触摸滑动
  let tx=0, ty=0, tt=0, sw=false;
  renderer.domElement.addEventListener('touchstart', e => {
    tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); sw=false;
  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e => {
    if(Math.abs(e.touches[0].clientX-tx)>15) sw=true;
    spawnTrail(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  renderer.domElement.addEventListener('touchend', e => {
    if(Date.now()-tt<300 && sw){
      const dx = e.changedTouches[0].clientX-tx;
      if(Math.abs(dx)>60) switchLayout(dx<0?(currentLayout+1)%4:(currentLayout+3)%4);
    }
  }, {passive:true});

  switchLayout(0);
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    resizePCanvas();
  });
}

function fitImg(img, dw, dh) {
  let r = 1;
  if (img.width/img.height >= dw/dh) { if(img.width>dw) r=dw/img.width; }
  else { if(img.height>dh) r=dh/img.height; }
  const w=img.width*r, h=img.height*r;
  img.style.width=w+'px'; img.style.height=h+'px';
  if(w<dw) img.style.paddingLeft=((dw-w)/2)+'px';
  if(h<dh) img.style.paddingTop=((dh-h)/2)+'px';
}

function switchLayout(idx) {
  if (idx===currentLayout && objects.length>0 && objects[0].position.distanceTo(targets[['table','sphere','helix','grid'][idx]][0].position)<10) return;
  currentLayout = idx;
  burst(innerWidth/2, innerHeight/2, 80);
  doTransform([targets.table, targets.sphere, targets.helix, targets.grid][idx], 2000);
  document.querySelectorAll('.dot').forEach((d,i) => d.className = i===idx?'dot active':'dot');
  const n = document.getElementById('layout-name');
  n.textContent = layoutNames[idx]; n.className = 'show';
  setTimeout(() => n.className='', 1500);
}

function doTransform(tgts, dur) {
  TWEEN.removeAll();
  for (let i = 0; i < objects.length; i++) {
    const o=objects[i], t=tgts[i];
    new TWEEN.Tween(o.position).to({x:t.position.x,y:t.position.y,z:t.position.z}, Math.random()*dur+dur)
      .easing(TWEEN.Easing.Exponential.InOut).start();
    new TWEEN.Tween(o.rotation).to({x:t.rotation.x,y:t.rotation.y,z:t.rotation.z}, Math.random()*dur+dur)
      .easing(TWEEN.Easing.Exponential.InOut).start();
  }
  new TWEEN.Tween({}).to({},dur*2).onUpdate(()=>renderer.render(scene,camera)).start();
}

// ============================================================
//  星空渲染器 (独立 WebGL 层)
// ============================================================
let starRenderer, starScene, starCamera;
function initStarRenderer() {
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none';
  document.body.insertBefore(c, document.getElementById('container'));

  starRenderer = new THREE.WebGLRenderer({canvas:c, alpha:true, antialias:true});
  starRenderer.setSize(innerWidth, innerHeight);
  starRenderer.setPixelRatio(devicePixelRatio);
  starRenderer.setClearColor(0x000000, 0);

  starScene = new THREE.Scene();
  starScene.add(starPoints);
  starCamera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 10000);
  starCamera.position.z = 3000;

  window.addEventListener('resize', () => {
    starRenderer.setSize(innerWidth, innerHeight);
    starCamera.aspect = innerWidth/innerHeight;
    starCamera.updateProjectionMatrix();
  });
}

// ============================================================
//  手势识别 (MediaPipe Tasks-Vision)
// ============================================================
async function initGesture() {
  try {
    const { FilesetResolver, HandLandmarker } = await import(
      'https://guzhicdn.21212121.xyz/vendor/mediapipe/tasks-vision/0.10.3/vision_bundle.js'
    );

    const vision = await FilesetResolver.forVisionTasks(
      'https://guzhicdn.21212121.xyz/vendor/mediapipe/tasks-vision/0.10.3/wasm'
    );

    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://guzhicdn.21212121.xyz/vendor/mediapipe/models/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1
    });

    camVideo = document.createElement('video');
    camVideo.setAttribute('playsinline','');
    camVideo.setAttribute('autoplay','');
    camVideo.muted = true;
    camVideo.style.display = 'none';
    document.body.appendChild(camVideo);

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    camVideo.srcObject = stream;
    camVideo.addEventListener('loadeddata', predictLoop);

    setGestureUI('📡','手势已就绪');
  } catch(e) {
    console.warn('Gesture init failed:', e);
    setGestureUI('','键盘 ← → 切换 | 鼠标拖动旋转');
  }
}

// === 帧循环 (跳过未变化的帧，和原项目一致) ===
function predictLoop() {
  if (!handLandmarker || !camVideo) return;
  if (camVideo.currentTime !== lastVideoTime) {
    lastVideoTime = camVideo.currentTime;
    const result = handLandmarker.detectForVideo(camVideo, performance.now());
    processGestures(result);
  }
  requestAnimationFrame(predictLoop);
}

// === 手势处理 (完整移植自 gesture-Christmas_tree) ===
function processGestures(result) {
  if (result.landmarks && result.landmarks.length > 0) {
    const lm = result.landmarks[0];

    // 手掌中心映射到 [-1, 1] (镜像X)
    handState.handX = (0.5 - lm[9].x) * 2;
    handState.handY = (lm[9].y - 0.5) * 2;

    // 手部大小归一化
    const wrist = lm[0];
    const middleMCP = lm[9];
    const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
    if (handSize < 0.02) return; // 手太小/太远，跳过

    // 4个指尖到手腕的平均距离
    const tips = [lm[8], lm[12], lm[16], lm[20]];
    let avgTipDist = 0;
    for (const t of tips) avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y);
    avgTipDist /= 4;

    // 拇指到食指距离
    const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

    // 归一化比值
    const extensionRatio = avgTipDist / handSize;
    const pinchRatio = pinchDist / handSize;

    // 状态机 (带死区 1.5~1.7)
    if (extensionRatio < 1.5) {
      // 握拳 → 布局复位 + 粒子爆发
      if (handState.mode !== 'FIST') {
        handState.mode = 'FIST';
        burst(innerWidth/2, innerHeight/2, 150);
        setGestureUI('✊','握拳爆发');
      }
    } else if (pinchRatio < 0.35) {
      // 捏合 → 缩放
      if (handState.mode !== 'PINCH') {
        handState.mode = 'PINCH';
        setGestureUI('🤏','捏合缩放');
      }
      // 用捏合距离驱动缩放
      const targetZ = 1500 + (1 - pinchRatio / 0.35) * 3000;
      camera.position.z += (targetZ - camera.position.z) * 0.08;
    } else if (extensionRatio > 1.7) {
      // 张开手掌 → 旋转/滑动
      if (handState.mode !== 'OPEN') {
        handState.mode = 'OPEN';
        setGestureUI('✋','手掌控制');
      }
    }
    // 1.5 < ext < 1.7: 死区，不切换模式

  } else {
    handState.mode = 'IDLE';
    setGestureUI('','');
  }
}

// === 在 animate() 中用指数平滑驱动旋转 (和原项目一致) ===
function updateHandRotation(dt) {
  if (handState.mode === 'OPEN') {
    // 手掌位置映射到目标旋转角
    const targetRotY = handState.handX * Math.PI * 0.9;
    const targetRotX = handState.handY * Math.PI * 0.25;
    handState.rotation.y += (targetRotY - handState.rotation.y) * 3.0 * dt;
    handState.rotation.x += (targetRotX - handState.rotation.x) * 3.0 * dt;

    // 检测大幅度横移 → 切换布局
    if (Math.abs(handState.handX) > 0.85 && Date.now() > gestureCooldown) {
      switchLayout(handState.handX > 0 ? (currentLayout+3)%4 : (currentLayout+1)%4);
      gestureCooldown = Date.now() + 1000;
    }
  } else {
    // 无手势时缓慢回正
    handState.rotation.y += (0 - handState.rotation.y) * 1.5 * dt;
    handState.rotation.x += (0 - handState.rotation.x) * 1.5 * dt;
  }

  // 应用旋转到控制器目标
  controls.target.x += (handState.rotation.y * 300 - controls.target.x) * 2.0 * dt;
  controls.target.y += (-handState.rotation.x * 150 - controls.target.y) * 2.0 * dt;
  controls.update();
}

function setGestureUI(icon, text) {
  document.getElementById('gesture-icon').textContent = icon;
  document.getElementById('gesture-text').textContent = text;
}

// ============================================================
//  主循环
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.getElapsedTime();
  TWEEN.update();
  controls.update();
  updateHandRotation(dt);
  updateStars(dt, t);
  starRenderer.render(starScene, starCamera);
  drawParticles(dt);
  renderer.render(scene, camera);
}

// ============================================================
//  启动
// ============================================================
buildPhotoData();
createStarField();
initScene();
initStarRenderer();
initParticleCanvas();
animate();
initGesture();

</script>
